name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ohantorzzbxjkkgtspgn.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYW50b3J6emJ4amtrZ3RzcGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3OTcwMDQsImV4cCI6MjA5MDM3MzAwNH0.cDby1HJcvWu5XBCUSSJiOGncHk51rIzCpoMRO3toebI
        run: |
          set -e
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/")
          echo "REST -> HTTP $HTTP"
          [ "$HTTP" = "200" ] || exit 1
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/settings")
          echo "Auth -> HTTP $HTTP"
          [ "$HTTP" = "200" ] || exit 1
          echo "Keep-alive OK."
